            - row "最佳华语流行专辑 2010s anontraveler Open source link album_rank 这十年有个大的趋势就是主流音乐的另类小众硬地化，尤其是港台。一些新的歌手，柯泯薰、黄玠玮、冯颖琪、范安婷等都有着明显的另类音乐影响来源，但又是典型而主流音乐。其实全球都有这个趋势，随着大主流音乐的崩盘，主流音乐和独立音乐之间而界限越发模糊。 而另一方面，随着某些口径的收紧和时代上升的变迁，整个音乐都变得更关注自我和身边生活，政治议题越来越淡出，很难见到90年代到00初那些从讽刺到愤怒到歌颂到悲悯的各种更加丰富的情感走入半主流视野，即使这个时代独立音乐走向半主流。 10年代大量独立音乐使用英语演唱，不过考虑到大部分也就初中英文水准，也不妨收入。 参考： [【个人精选】2010年代华语主流流行乐专辑20张推荐 - 雪岭洞箫声Snowii](https://zhuanlan.zhihu.com/p/150214926) [【盘点向】2010s 华语高分流行乐专辑回顾 - 半月凝霜Frostii](https://zhuanlan.zhihu.com/p/407143984) [石田吉藏 的 华语最佳500张发行 榜单](https://www.anontraveler.com/rank/version/647a1b28ab0a877f000408e9) Edit 最佳华语流行专辑 2010s Delete 最佳华语流行专辑 2010s" [ref=e82]:
