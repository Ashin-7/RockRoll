            - row "泛摇滚领域坐标专辑 - 现代摇滚早期篇 anontraveler Open source link album_rank 前朋、朋克、后朋、新浪潮、新迷幻、早期硬核,60-80年代。目标300张左右。 和经典摇滚那一集不同，经典摇滚一般专辑之间差异不会太大，有一定差异我也会选入两张或以上，比如Neil Young，专辑间差异还没有Zappa一首歌之间的两段落来的大。但是对于现代摇滚偏实验的那些，几乎每张专辑都有很大的差异，如果按照有名、重要而且有差异，这个单子就收不住容量了。所以注意，扩展区的质量不一定低于正式区，很多是音乐人的其他优秀作品，为了单子容量牺牲掉入选，但是依然值得听的；或者是相对历史上影响比较小知名度较低的质量优秀作品。 所以，除了VU、Zappa这样的乐队、艺人，大部分情况下，一个乐队只收入一张最经典作品，其他的大家自行去了解即可，顶多在扩展区随便放一下。还有过于迪哥的作品除了古早有时代意义的，也尽量不选。想了解我额外再做个史前另类全书这样的榜单来选大迪专辑。 还有就是，尽量不选偏极端化的作品，更实验的作品请移步这个单子 [泛摇滚领域坐标专辑 - 实验、极端、黑暗篇](https://www.anontraveler.com/rank/version/662739610b931e2d02041ed9)。 [网易云歌单](https://music.163.com/#/playlist?id=12338152104) Edit 泛摇滚领域坐标专辑 - 现代摇滚早期篇 Delete 泛摇滚领域坐标专辑 - 现代摇滚早期篇" [ref=e126]:
